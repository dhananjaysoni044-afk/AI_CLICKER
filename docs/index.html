<style>

</style></head><body><canvas id="world"></canvas><div id="hud">
<div class="top"><div><div class="brand">✨ अयोध्या की दिवाली</div><div class="tag">A LITTLE 3D FESTIVE WORLD</div></div><button class="action" id="sound">🔊 Sound on</button></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#world'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111936);scene.fog=new THREE.Fog(0x111936,28,75);

scene.add(new THREE.HemisphereLight(0xb9d6ff,0x65402d,2));const moon=new THREE.DirectionalLight(0xffdfaa,2.5);moon.position.set(-8,16,7);moon.castShadow=true;scene.add(moon);
const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});
const ground= new THREE.Mesh(new THREE.PlaneGeometry(90,90),mat(0x263d43));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function box(x,y,z,w,h,d,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function roof(x,z,w,d,color=0x9e5944){const m=new THREE.Mesh(new THREE.ConeGeometry(w*.78,.9,4),mat(color));m.rotation.y=Math.PI/4;m.scale.set(1,1,d/w);m.position.set(x,2.25,z);m.castShadow=true;scene.add(m)}
function lamp(x,z){const base=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,.12,12),mat(0xc67a42));base.position.set(x,.12,z);scene.add(base);const flame=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8),new THREE.MeshBasicMaterial({color:0xffd36a}));flame.position.set(x,.3,z);scene.add(flame);const l=new THREE.PointLight(0xffb94f,1.2,4);l.position.set(x,.6,z);scene.add(l)}
function tree(x,z){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.22,1.4,8),mat(0x79513a));trunk.position.set(x,.7,z);scene.add(trunk);for(let i=0;i<3;i++){const leaf=new THREE.Mesh(new THREE.IcosahedronGeometry(.7-i*.08,1),mat(i===1?0x347b58:0x286747));leaf.position.set(x,(1.5+i*.48),z);leaf.castShadow=true;scene.add(leaf)}}
function house(x,z,poster=true){box(x,1,z,3.2,2,3,0xc88c68);roof(x,z,3.7,3.4,0x873e3b);box(x,0.85,z+1.53,.8,1.7,.12,0x49303a);for(let dx of [-.9,.9])box(x+dx,1.35,z+1.57,.55,.55,.1,0x8ec1c6);if(poster){const cv=document.createElement('canvas');cv.width=256;cv.height=320;const q=cv.getContext('2d');const gr=q.createLinearGradient(0,0,256,320);gr.addColorStop(0,'#632d47');gr.addColorStop(1,'#c16c3d');q.fillStyle=gr;q.fillRect(0,0,256,320);q.strokeStyle='#ffe3a0';q.lineWidth=8;q.strokeRect(8,8,240,304);q.textAlign='center';q.fillStyle='#ffe7a7';q.font='bold 27px Georgia';q.fillText('HAPPY',128,55);q.fillText('DIWALI',128,88);q.font='58px serif';q.fillText('🪔',128,165);q.font='46px serif';q.fillText('🧑🏻‍🤝‍🧑🏻',128,230);q.font='16px Georgia';q.fillText('Light • Love • Joy',128,280);const tex=new THREE.CanvasTexture(cv);const p=new THREE.Mesh(new THREE.PlaneGeometry(.95,1.2),new THREE.MeshBasicMaterial({map:tex}));p.position.set(x+.65,1.5,z+1.62);scene.add(p)}}
house(-8,-7);house(8,-7);house(-9,5);house(9,5);house(-15,-1,false);house(15,-1,false);
for(let i=0;i<14;i++){tree(-19+i*3,12+(i%2)*1.2);lamp(-18+i*2.7,9)}
// village road and river

const river=new THREE.Mesh(new THREE.PlaneGeometry(42,6),new THREE.MeshStandardMaterial({color:0x286e83,metalness:.25,roughness:.25}));river.rotation.x=-Math.PI/2;river.position.set(0,.04,-16);scene.add(river);
for(let i=-18;i<=18;i+=2)lamp(i, -12.5);
// temple
box(0,1.15,-5,7,2.3,5,0xe0b77c);const sanctum=new THREE.Mesh(new THREE.ConeGeometry(2.2,3.3,4),mat(0xb66d43));sanctum.position.set(0,3.8,-5);sanctum.rotation.y=Math.PI/4;scene.add(sanctum);const dome=new THREE.Mesh(new THREE.SphereGeometry(1.25,24,16,0,Math.PI*2,0,Math.PI/2),mat(0xf0c889));dome.position.set(0,2.35,-5);scene.add(dome);box(0,1.15,-2.45,1.4,2.3,.35,0x573448);box(-2,1.5,-2.4,.8,3,.4,0xd59d62);box(2,1.5,-2.4,.8,3,.4,0xd59d62);
const signCanvas=document.createElement('canvas');signCanvas.width=512;signCanvas.height=128;let sc=signCanvas.getContext('2d');sc.fillStyle='#4c2635';sc.fillRect(0,0,512,128);sc.strokeStyle='#ffdf9c';sc.lineWidth=8;sc.strokeRect(5,5,502,118);sc.fillStyle='#ffe8ae';sc.font='bold 48px Georgia';sc.textAlign='center';sc.fillText('श्री राम मंदिर',256,80);const sign=new THREE.Mesh(new THREE.PlaneGeometry(5,1.25),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(signCanvas)}));sign.position.set(0,3.8,-2.25);scene.add(sign);
for(let x=-3;x<=3;x+=1.5)lamp(x,-1.7);
// bazaar stalls
for(let i=0;i<4;i++){let x=-12+i*8;box(x,.8,8,3,1.6,2.2,[0xa34f3f,0x8e6940,0x477c70,0x7a4b79][i]);box(x,1.8,8,3.4,.18,2.5,0xe9b76c);lamp(x,6.6)}
// destination
const marker=new THREE.Mesh(new THREE.TorusGeometry(1.1,.07,8,48),new THREE.MeshBasicMaterial({color:0xffd36a}));marker.rotation.x=Math.PI/2;marker.position.set(0,.16,12);scene.add(marker);const beam=new THREE.PointLight(0xffbd65,2,9);beam.position.set(0,2,12);scene.add(beam);
function person(x,z,shirt,skin=0xe7b58e){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.7,4,8),mat(shirt));body.position.y=1.05;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),mat(skin));head.position.y=1.72;head.castShadow=true;g.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.29,12,8,0,Math.PI*2,0,Math.PI/2),mat(0x30232a));hair.position.y=1.83;g.add(hair);const legmat=mat(0x45394b);for(let dx of [-.16,.16]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.09,.1,.55,8),legmat);leg.position.set(dx,.35,0);g.add(leg)}g.position.set(x,0,z);scene.add(g);return g}
const hero=person(0,13,0x6b83c4,0xe6b28f);const dev=person(1.7,13,0xc45f83,0xf0c39d);hero.rotation.y=Math.PI;dev.rotation.y=Math.PI;
const villagers=[person(-12,2,0x4f9b82),person(12,1,0xc17b48),person(-7,10,0x8971b8),person(7,7,0x6e9cb8)];villagers.forEach((v,i)=>v.userData={phase:i*2,speed:.4+i*.08,origin:v.position.clone()});
const player=person(0,7,0x5f82c9);player.scale.set(.9,.9,.9);let target=null,activePage='world',near='';const pages={mandir:['🛕','श्री राम मंदिर','मंदिर के आँगन में आपका स्वागत है। यहाँ कुछ पल शांति से बिताइए। प्रभु श्री राम सबके जीवन में साहस, करुणा और सुख-शांति दें।'],market:['🏮','रंगों वाला दिवाली बाज़ार','दीयों की रोशनी, फूलों की खुशबू और मिठाइयों की रौनक! छोटे बाज़ार में घूमिए और त्योहार की खुशी महसूस कीजिए।'],album:['🎇','दिवाली पोस्टर गली','हर घर पर एक रंगीन Happy Diwali पोस्टर लगा है—दो प्यारे illustrated characters के साथ। असली couple photo मिलने पर इसे बदला जा सकता है।']};
function showPanel(icon,title,body,buttons=[]){document.getElementById('panelIcon').textContent=icon;document.getElementById('panelTitle').textContent=title;document.getElementById('panelBody').innerHTML=body;const a=document.getElementById('panelActions');a.innerHTML='';buttons.forEach(b=>{let el=document.createElement('button');el.className='action';el.textContent=b.label;el.onclick=b.fn;a.append(el)});document.getElementById('panel').classList.add('show')}
function setPage(p){activePage=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='world'){document.getElementById('panel').classList.remove('show');return}if(p==='meet'){player.position.set(0,7,0);showPanel('💛','विशेष मुलाक़ात','<p>यहाँ पहुँचकर दोनों animated characters की प्यारी-सी मुलाक़ात होगी।</p>',[{label:'मुलाक़ात शुरू करें ✨',fn:startMeet}]);return}let d=pages[p];if(d)showPanel(d[0],d[1],'<p>'+d[2]+'</p>')}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));document.getElementById('panelClose').onclick=()=>{document.getElementById('panel').classList.remove('show');activePage='world';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='world'))};
let dialogueIndex=0;const lines=[['🧑🏻','तुम्हारे लिए एक छोटी-सी बात कहनी थी…','मैंने इस दिवाली तुम्हारे लिए एक छोटा-सा संसार सजाया है।'],['🧑🏻','दिवाली के दीयों जैसी रोशनी…','तुम्हारी हँसी में जैसे हर शाम सवेरा हो जाता है।'],['🧑🏻','एक छोटी-सी शायरी सुनो…','तेरी मुस्कान से रोशन हर शाम रहे, तेरे हर ख़्वाब के नाम एक नया आसमान रहे। खुशियों से भरा रहे तेरा हर एक सफ़र, और हर मोड़ पर तेरा अपना जहान रहे।'],['🧑🏻','एक प्यारी-सी बात पूछूँ?','क्या तुम इस खूबसूरत सफ़र में मेरी दोस्त बनकर, हर त्योहार की खुशियाँ साथ बाँटना चाहोगी? 💛'],['🌸','देवांशी की प्यारी-सी प्रतिक्रिया','यह दिवाली सच में यादगार बन गई! चलो, इस खुशी को हमेशा अच्छे पलों और मुस्कान के साथ सजाकर रखें। ✨']];function startMeet(){dialogueIndex=0;player.position.set(0,7,0);hero.position.set(-1,13,0);dev.position.set(1.7,13,0);nextLine()}
function nextLine(){if(dialogueIndex>=lines.length){showPanel('🎆','दिवाली की ढेर सारी शुभकामनाएँ','<p>आप दोनों के लिए खुशियों, सम्मान, दोस्ती और अच्छे पलों से भरा त्योहार हो।</p>');return}let l=lines[dialogueIndex++];showPanel(l[0],l[1],'<div class="dialogue">'+l[2]+'<small>ANIMATED NPC · HINDI DIALOGUE</small></div>',[{label:dialogueIndex===lines.length?'समाप्त ✨':'आगे बढ़ें →',fn:nextLine}])}
document.getElementById('interact').onclick=()=>{if(near==='temple')setPage('mandir');else if(near==='market')setPage('market');else if(near==='meet')setPage('meet');else if(near==='poster')setPage('album');else showPanel('✨','थोड़ा और घूमो!','किसी चमकते हुए स्थान के पास जाओ—मंदिर, बाज़ार, पोस्टर गली या विशेष मुलाक़ात।')};
const dirs={up:[0,-.45],down:[0,.45],left:[-.45,0],right:[.45,0]},held={};document.querySelectorAll('[data-move]').forEach(b=>{let d=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();held[d]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>held[d]=false))});
addEventListener('keydown',e=>{let k={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(k){held[k]=true;e.preventDefault()}});addEventListener('keyup',e=>{let k={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(k)held[k]=false});
document.getElementById('sound').onclick=()=>{document.getElementById('sound').textContent='🔇 Sound off';document.getElementById('hint').innerHTML='<b>Sound off</b><br>Visual world and Hindi dialogues are ready.'};
let clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);if(activePage==='world'||!document.getElementById('panel').classList.contains('show')){let dx=0,dz=0;for(let k in held){if(held[k]){dx+=dirs[k][0];dz+=dirs[k][1]}}if(dx||dz){let len=Math.hypot(dx,dz);player.position.x=THREE.MathUtils.clamp(player.position.x+dx/len*5*dt,-18,18);player.position.z=THREE.MathUtils.clamp(player.position.z+dz/len*5*dt,-18,17);player.rotation.y=Math.atan2(dx,dz);player.position.y=Math.abs(Math.sin(performance.now()*.01))*.04}}
villagers.forEach(v=>{let ph=performance.now()*.00035*v.userData.speed+v.userData.phase;v.position.x=v.userData.origin.x+Math.sin(ph)*1.3;v.position.z=v.userData.origin.z+Math.cos(ph)*.9;v.rotation.y=Math.cos(ph)*.5});
let t=performance.now()*.001;marker.rotation.z=t;marker.scale.setScalar(1+Math.sin(t*2)*.08);beam.intensity=1.5+Math.sin(t*3)*.5;lampLights.forEach((l,i)=>l.intensity=1+Math.sin(t*3+i)*.25);
let camTarget=new THREE.Vector3(player.position.x,player.position.y+5.5,player.position.z+9);camera.position.lerp(camTarget,.07);camera.lookAt(player.position.x,1,player.position.z-2);
let dist=(x,z)=>Math.hypot(player.position.x-x,player.position.z-z);near=dist(0,-3)<5?'temple':dist(0,8)<6?'market':dist(0,12)<6?'meet':dist(0,0)<4?'poster':'';let names={temple:'मंदिर',market:'बाज़ार',meet:'विशेष मुलाक़ात',poster:'पोस्टर गली'};if(near)document.getElementById('hint').innerHTML='<b>'+names[near]+' पास है!</b><br>Interact दबाकर यहाँ का surprise खोलो।<br><button class="action primary" onclick="document.getElementById(\\'interact\\').click()">✨ Interact</button>';renderer.render(scene,camera)}
const lampLights=[];scene.traverse(o=>{if(o.isPointLight)lampLights.push(o)});animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
</script></body></html>
